<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
</head>
<body>

    <!-- Encabezado superior -->
    <header>
        <nav>
            <a href="https://mail.google.com">Gmail</a>
            <a href="https://www.google.com/imghp">Imágenes</a>
            <button type="button">Iniciar sesión</button>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>
        <section>
            <!-- Logo de Google -->
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google" width="272" height="92">
            
            <!-- Barra de búsqueda y botones -->
            <form action="https://www.google.com/search" method="GET">
                <div>
                    <input type="text" name="q" title="Buscar" placeholder="Buscar en Google o escribir una URL" required>
                </div>
                <div>
                    <button type="submit">Buscar con Google</button>
                    <button type="submit" name="btnI">Voy a tener suerte</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <div>
            <span>Ecuador</span>
        </div>
        <hr>
        <nav>
            <a href="#">Sobre Google</a>
            <a href="#">Publicidad</a>
            <a href="#">Negocios</a>
            <a href="#">Cómo funciona la Búsqueda</a>
            <a href="#">Privacidad</a>
            <a href="#">Condiciones</a>
            <a href="#">Preferencias</a>
        </nav>
    </footer>

</body>
</html>
